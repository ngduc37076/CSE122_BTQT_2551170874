<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài 15 - Máy tính đơn giản</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0b0f19;
      font-family: "Segoe UI", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
    }

    .may {
      background: #111827;
      border-radius: 16px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, .55);
      padding: 22px;
      width: 100%;
      max-width: 420px;
    }

    .man-hinh {
      background: #022c22;
      border-radius: 12px;
      padding: 18px 20px;
      text-align: right;
      margin-bottom: 20px;
      min-height: 118px;
    }

    .phep-tinh {
      color: #4ade80;
      font-size: 22px;
      opacity: .85;
      word-break: break-all;
      min-height: 26px;
    }

    .ket-qua {
      color: #4ade80;
      font-size: 48px;
      font-weight: 700;
      word-break: break-all;
      line-height: 1.15;
    }

    .ban-phim {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }

    .nut {
      border: 0;
      border-radius: 12px;
      height: 68px;
      font-size: 24px;
      cursor: pointer;
      font-family: inherit;
    }

    .nut:active {
      transform: scale(.96);
    }

    .so {
      background: #25313f;
      color: #e5e7eb;
    }

    .toan-tu {
      background: #0d6efd;
      color: #FFFFFF;
    }

    .bang {
      background: #16a34a;
      color: #FFFFFF;
    }

    .xoa {
      background: #dc2626;
      color: #FFFFFF;
    }

    .rong-2 {
      grid-column: span 2;
    }

    footer {
      color: #64748b;
      text-align: center;
      font-size: 13px;
      margin-top: 16px;
    }

    @media (max-width: 400px) {
      body { align-items: flex-start; }
      .may { padding: 14px; }
      .nut { height: 58px; font-size: 20px; }
      .ban-phim { gap: 9px; }
      .ket-qua { font-size: 38px; }
    }

  </style>
</head>

<body>

  <div>
    <main class="may">
      <h1 class="sr-only">Bài 15 - Máy tính đơn giản</h1>

      <section class="man-hinh">
        <p class="phep-tinh" id="phepTinh">0</p>
        <p class="ket-qua" id="ketQua">0</p>
      </section>

      <section class="ban-phim" id="banPhim" aria-label="Bàn phím máy tính">

        <button type="button" class="nut xoa" data-phim="C">C</button>
        <button type="button" class="nut toan-tu" data-phim="()">( )</button>
        <button type="button" class="nut toan-tu" data-phim="%">%</button>
        <button type="button" class="nut toan-tu" data-phim="÷">÷</button>

        <button type="button" class="nut so" data-phim="7">7</button>
        <button type="button" class="nut so" data-phim="8">8</button>
        <button type="button" class="nut so" data-phim="9">9</button>
        <button type="button" class="nut toan-tu" data-phim="×">×</button>

        <button type="button" class="nut so" data-phim="4">4</button>
        <button type="button" class="nut so" data-phim="5">5</button>
        <button type="button" class="nut so" data-phim="6">6</button>
        <button type="button" class="nut toan-tu" data-phim="−">−</button>

        <button type="button" class="nut so" data-phim="1">1</button>
        <button type="button" class="nut so" data-phim="2">2</button>
        <button type="button" class="nut so" data-phim="3">3</button>
        <button type="button" class="nut toan-tu" data-phim="+">+</button>

        <button type="button" class="nut so rong-2" data-phim="0">0</button>
        <button type="button" class="nut so" data-phim=".">.</button>
        <button type="button" class="nut bang" data-phim="=">=</button>

      </section>
    </main>

    <footer>Bài 15 - máy tính tự tách số và toán tử, không dùng hàm eval của JavaScript</footer>
  </div>

  <script>

    const TOAN_TU = ["+", "−", "×", "÷"];
    let bieuThuc = "";
    let ketQua = "0";
    let vuaBamBang = false;

    const choPhepTinh = document.getElementById("phepTinh");
    const choKetQua = document.getElementById("ketQua");

    function ve() {
      choPhepTinh.textContent = bieuThuc === "" ? "0" : bieuThuc;
      choKetQua.textContent = ketQua;
    }

    function tachToken(s) {
      const chuanHoa = s.replace(/×/g, "*").replace(/÷/g, "/").replace(/−/g, "-");
      const ketQuaTach = chuanHoa.match(/\d+\.?\d*%?|\.\d+%?|[+\-*\/()]/g);
      if (!ketQuaTach) return null;
      const danhSach = [];
      for (let i = 0; i < ketQuaTach.length; i++) {
        const token = ketQuaTach[i];
        const phiaTruoc = danhSach[danhSach.length - 1];
        const laTruAm = token === "-" && (phiaTruoc === undefined || phiaTruoc === "(" || /[+\-*\/]/.test(phiaTruoc));
        if (laTruAm && /^\d/.test(ketQuaTach[i + 1] || "")) {
          danhSach.push("-" + ketQuaTach[i + 1]);
          i++;
        } else {
          danhSach.push(token);
        }
      }
      return danhSach.map(function (t) {
        return t.endsWith("%") ? String(parseFloat(t) / 100) : t;
      });
    }

    function hopLe(danhSach) {
      if (danhSach === null || danhSach.length === 0) return false;
      if (danhSach.length % 2 === 0) return false;
      for (let i = 0; i < danhSach.length; i++) {
        const viTriTinh = i % 2 === 0;
        const laSo = /^-?\d/.test(danhSach[i]);
        if (viTriTinh && !laSo) return false;
        if (!viTriTinh && (laSo || !/[+\-*\/]/.test(danhSach[i]))) return false;
      }
      return true;
    }

    function tinhPhang(danhSach) {
      const token = danhSach.slice();
      let i = 1;
      while (i < token.length - 1) {
        if (token[i] === "*" || token[i] === "/") {
          if (token[i] === "/" && Number(token[i + 1]) === 0) throw new Error("Chia cho 0");
          const a = Number(token[i - 1]);
          const b = Number(token[i + 1]);
          const kq = token[i] === "*" ? a * b : a / b;
          token.splice(i - 1, 3, String(kq));
          i = 1;
        } else {
          i += 2;
        }
      }
      let giaTri = Number(token[0]);
      for (let j = 1; j < token.length - 1; j += 2) {
        const b = Number(token[j + 1]);
        if (token[j] === "+") {
          giaTri = giaTri + b;
        } else {
          giaTri = giaTri - b;
        }
      }
      return giaTri;
    }

    function tinh(danhSach) {
      const token = danhSach.slice();
      while (token.indexOf("(") !== -1) {
        let mo = -1;
        for (let k = token.length - 1; k >= 0; k--) {
          if (token[k] === "(") { mo = k; break; }
        }
        let dong = -1;
        for (let k = mo + 1; k < token.length; k++) {
          if (token[k] === ")") { dong = k; break; }
        }
        if (dong === -1) throw new Error("Ngoặc không đôi");
        const benTrong = token.slice(mo + 1, dong);
        if (!hopLe(benTrong)) throw new Error("Biểu thức sai");
        token.splice(mo, dong - mo + 1, String(tinhPhang(benTrong)));
      }
      if (!hopLe(token)) throw new Error("Biểu thức sai");
      return tinhPhang(token);
    }

    function dinhDangSo(n) {
      if (!Number.isFinite(n)) throw new Error("Kết quả vượt giới hạn");
      return String(Math.round(n * 1e10) / 1e10);
    }

    function soHieuCuoi() {
      return bieuThuc.split(/[+\-−×÷()%]/).pop();
    }

    function bam(phim) {
      if (phim === "C") {
        bieuThuc = "";
        ketQua = "0";
        vuaBamBang = false;
      } else if (phim === "=") {
        if (bieuThuc === "") return;
        try {
          ketQua = dinhDangSo(tinh(tachToken(bieuThuc)));
          vuaBamBang = true;
        } catch (loi) {
          ketQua = "Lỗi";
          vuaBamBang = false;
        }
      } else if (/^[0-9.]$/.test(phim)) {
        if (vuaBamBang) {
          bieuThuc = "";
          ketQua = "0";
          vuaBamBang = false;
        }
        if (phim === "." && soHieuCuoi().indexOf(".") !== -1) return;
        if (bieuThuc.length >= 24) return;
        bieuThuc += phim;
      } else if (TOAN_TU.indexOf(phim) !== -1) {
        if (vuaBamBang) {
          bieuThuc = ketQua === "Lỗi" ? "" : ketQua;
          ketQua = "0";
          vuaBamBang = false;
        }
        if (bieuThuc === "") {
          if (phim !== "−") return;
          bieuThuc = "−";
        } else if (TOAN_TU.indexOf(bieuThuc.slice(-1)) !== -1) {
          bieuThuc = bieuThuc.slice(0, -1) + phim;
        } else {
          bieuThuc += phim;
        }
      } else if (phim === "%") {
        if (vuaBamBang) {
          bieuThuc = ketQua === "Lỗi" ? "" : ketQua;
          vuaBamBang = false;
        }
        if (!/\d$/.test(bieuThuc)) return;
        bieuThuc += "%";
      } else if (phim === "()") {
        const soMo = (bieuThuc.match(/\(/g) || []).length;
        const soDong = (bieuThuc.match(/\)/g) || []).length;
        const duoi = bieuThuc.slice(-1);
        if (duoi !== "" && /[0-9.)%]/.test(duoi) && soMo > soDong) {
          bieuThuc += ")";
        } else {
          bieuThuc += "(";
        }
        vuaBamBang = false;
      }
      ve();
    }

    document.getElementById("banPhim").addEventListener("click", function (e) {
      const nut = e.target.closest("button");
      if (nut) bam(nut.dataset.phim);
    });

    ve();

  </script>
</body>
</html>

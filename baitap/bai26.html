<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài 26 - Form đăng ký CLB Lập trình Web</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: #e9ecef;
    }

    .card {
      background: #ffffff;
      border: 0;
      border-radius: .75rem;
      box-shadow: 0 10px 30px rgba(33, 37, 41, .12);
    }

    .card-header {
      background: #198754;
      border-radius: .75rem .75rem 0 0;
    }

    .form-control, .form-select {
      padding: .7rem .85rem;
    }

    .form-check-label {
      font-size: 1.05rem;
    }
  </style>
</head>

<body>

  <main class="container py-5">
    <section class="row justify-content-center">
      <div class="col-12 col-lg-8 col-xl-6">

        <div class="card">
          <div class="card-header py-3">
            <h1 class="text-center text-white fs-3 mb-0">Đăng ký tham gia CLB Lập trình Web</h1>
          </div>

          <div class="card-body p-4">

            <form id="formDangKy" class="needs-validation">

              <div class="row g-3">

                <div class="col-md-6">
                  <label for="hoTen" class="form-label">Họ và tên</label>
                  <input type="text" class="form-control" id="hoTen" name="hoTen" placeholder="Nguyễn Văn A" required minlength="5">
                  <div class="invalid-feedback">Vui lòng nhập họ và tên (tối thiểu 5 ký tự).</div>
                </div>

                <div class="col-md-6">
                  <label for="maSV" class="form-label">Mã sinh viên</label>
                  <input type="text" class="form-control" id="maSV" name="maSV" placeholder="22xxxxxx" required pattern="[0-9]{8}" title="Mã sinh viên là 8 chữ số">
                  <div class="invalid-feedback">Mã sinh viên phải đúng 8 chữ số.</div>
                </div>

                <div class="col-md-6">
                  <label for="email" class="form-label">Email</label>
                  <input type="email" class="form-control" id="email" name="email" placeholder="sv@tlu.edu.vn" required>
                  <div class="invalid-feedback">Email chưa đúng định dạng.</div>
                </div>

                <div class="col-md-6">
                  <label for="sdt" class="form-label">Số điện thoại</label>
                  <input type="tel" class="form-control" id="sdt" name="sdt" placeholder="09xxxxxxxx" required pattern="0[0-9]{9}" title="Số điện thoại 10 chữ số, bắt đầu bằng 0">
                  <div class="invalid-feedback">Số điện thoại phải có 10 chữ số và bắt đầu bằng 0.</div>
                </div>

                <div class="col-12">
                  <label class="form-label">Trình độ</label>
                  <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="trinhDo" id="coBan" value="co-ban" required checked>
                    <label class="form-check-label" for="coBan">Cơ bản</label>
                  </div>
                  <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="trinhDo" id="kha" value="kha">
                    <label class="form-check-label" for="kha">Khá</label>
                  </div>
                  <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="trinhDo" id="tot" value="tot">
                    <label class="form-check-label" for="tot">Tốt</label>
                  </div>
                </div>

                <div class="col-12">
                  <label for="lop" class="form-label">Chọn lớp</label>
                  <select class="form-select" id="lop" name="lop" required>
                    <option value="" selected disabled>-- Chọn lớp --</option>
                    <option value="67CNTT1">67CNTT1</option>
                    <option value="67CNTT2">67CNTT2</option>
                    <option value="67KHCN">67KHCN</option>
                    <option value="67KTMT">67KTMT</option>
                  </select>
                  <div class="invalid-feedback">Bạn chưa chọn lớp sinh hoạt.</div>
                </div>

                <div class="col-12">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="camKet" name="camKet" required>
                    <label class="form-check-label" for="camKet">Tôi cam kết tự làm bài và quay video OBS</label>
                  </div>
                </div>

                <div class="col-12">
                  <div class="d-flex justify-content-end gap-2">
                    <button type="reset" class="btn btn-outline-secondary">Nhập lại</button>
                    <button type="submit" class="btn btn-success">Đăng ký</button>
                  </div>
                </div>

              </div>
            </form>

            <div id="ketQua" class="alert alert-success mt-4 d-none"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    var form = document.getElementById("formDangKy");
    var ketQua = document.getElementById("ketQua");

    form.addEventListener("invalid", function () {
      form.classList.add("was-validated");
    }, true);

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      ketQua.textContent = "Đăng ký thành công: " + form.hoTen.value + " - lớp " + form.lop.value;
      ketQua.classList.remove("d-none");
      form.classList.remove("was-validated");
      form.reset();
    });
  </script>
</body>
</html>

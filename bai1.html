<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thơ Bốn Mùa</title>
    <!-- <link rel="stylesheet" href="style.css"> -->
    <style>
        .container{
    font-family: 'Times New Roman', Times, serif;
    background-color: #FFFDE7;
    border-color: #9E9E9E ;
    border-width: 2px;
    border-style: solid;
    padding:20px;
}
h1{
    color:#D40000;
    background-color: #FFD9E6 ;
    text-align: center;
    font-weight: bold;
    padding: 5px;
    margin-top:0;

}
main{
    color:#0033CC ;
    text-align: center;
    font-style: italic;
}
.first_text{
    color:#D40000;
}
hr{
    border-color: #0033CC;
    width: 55%;
    border-width: 0.1px;
}
@media screen and (max-width: 700px){
.container{
    width: 90%;
    padding: 15px;
    margin:20px auto
}
}
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1 title="Đây là tên bài thơ">BỐN MÙA</h1>
        </header>
        <main>
            <div>
                Xuân về hoa nở khắp trời<br>
                Hạ sang nắng cháy rạng ngời phố quen<br> 
                Thu về lá rụng bên thềm 
            </div>
            <hr>
            <div class="first_text">
                Đông sang gió lạnh bên em đợi chờ<br>
                Bốn mùa là bốn giấc mơ<br>
                Thời gian đi mãi ta chờ đợi ai 
            </div>
            <hr>
            <div>
                Một năm rồi lại một năm<br>
                Vẫn còn câu hát thì thầm quê hương<br>
                Chờ xuân nắng mới soi đường 
            </div>
        </main>
    </div>
</body>
</html>
